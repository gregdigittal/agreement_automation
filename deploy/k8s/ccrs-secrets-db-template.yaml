# CCRS Database & Service Credentials
# Copy this file to ccrs-secrets-db.yaml, fill in real values, then:
#   kubectl apply -f deploy/k8s/ccrs-secrets-db.yaml -n cco-sandbox
#
# DO NOT commit the real secrets file — it is excluded by .gitignore.
apiVersion: v1
kind: Secret
metadata:
  name: ccrs-db-credentials
  namespace: cco-sandbox
type: Opaque
stringData:
  db-password: "REPLACE_ME"
  db-root-password: "REPLACE_ME"
  mail-password: "REPLACE_ME"
  ai-worker-db-url: "mysql+pymysql://ccrs:REPLACE_ME@127.0.0.1:3306/ccrs"
